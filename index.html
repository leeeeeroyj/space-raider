<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Raider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; }
      /* Touch: no scrolling, zooming, text selection or long-press menus while playing. */
      html, body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
          background: #05060d; color: #ffb547; font: 20px Silkscreen, monospace; text-align: center; padding: 24px;
        }
      }
      #game { width: 100%; height: 100%; }
      /* The canvas renders at 4x, so let the browser scale it smoothly: nearest-neighbour at an odd ratio makes pixels uneven. */
      #game canvas { image-rendering: auto !important; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">TURN YOUR PHONE SIDEWAYS TO PLAY</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
